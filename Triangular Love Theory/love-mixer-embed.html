<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love Mixer — Embed</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  /* ── Mary Blair palette: black 34 · dark ochre 18 · red 15 · muted cyan 14 · bone 11 · olive 8 ── */
  :root {
    --ink:    #12101a;
    --ink2:   #1b1826;
    --line:   #17121f;
    --ochre:  #d4972e;
    --red:    #e0462f;
    --cyan:   #4a9fb0;
    --bone:   #f2e5cd;
    --olive:  #7f8c3c;
    --plum:   #4e2a52;
    --peach:  #e8845e;
    --skin:   #edc49a;
    --muted:  #a2927a;

    --pad:   clamp(13px, 3.2vw, 26px);
    --h1:    clamp(21px, 5.4vw, 31px);
    --body:  clamp(14px, 3.7vw, 17px);
    --small: clamp(11px, 2.9vw, 13px);
    --tiny:  clamp(9.5px, 2.4vw, 11px);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(80vw 60vh at 18% 8%,  rgba(212,151,46,0.13), transparent 68%),
      radial-gradient(74vw 56vh at 88% 94%, rgba(74,159,176,0.13), transparent 70%),
      var(--ink);
    color: var(--bone);
    font-family: 'Lato', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; }
  .sprites { position:absolute; width:0; height:0; overflow:hidden; }

  .app { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* ── TOP BAR ── */
  .topbar {
    flex: 0 0 auto; height: clamp(38px, 7.6vh, 48px);
    display: flex; align-items: center; gap: 10px;
    padding: 0 var(--pad);
    border-bottom: 1px solid rgba(242,229,205,0.14);
    background: rgba(10,8,16,0.5);
    position: relative; z-index: 6;
  }
  .brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(14px, 3.6vw, 17px); color: var(--ochre); white-space: nowrap;
  }
  .spacer { flex: 1 1 auto; }
  .stamp { font-size: var(--tiny); letter-spacing: 2.4px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

  /* ── SCREENS ── */
  .stack { position: relative; flex: 1 1 auto; min-height: 0; }
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: clamp(9px, 2vh, 18px) var(--pad);
    overflow-y: auto; overscroll-behavior: contain;
    opacity: 0; visibility: hidden; transform: translateY(12px);
    transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
  }
  .screen.on {
    opacity: 1; visibility: visible; transform: none;
    transition: opacity .3s ease .12s, transform .3s ease .12s, visibility 0s;
  }
  .screen::-webkit-scrollbar { width: 5px; }
  .screen::-webkit-scrollbar-thumb { background: rgba(242,229,205,0.18); border-radius: 3px; }
  .inner { width: 100%; max-width: 560px; margin: auto 0; }

  /* ── KITCHEN ── */
  /* the painted backdrop, dimmed so the glassware and type stay readable.
     Falls back to the body gradient if art/kitchen.jpg isn't there yet. */
  #s-kitchen {
    background-image:
      linear-gradient(180deg, rgba(14,12,20,0.74) 0%, rgba(14,12,20,0.56) 42%, rgba(14,12,20,0.86) 100%),
      url('art/kitchen.jpg');
    background-size: cover, cover;
    background-position: center, center;
    background-repeat: no-repeat, no-repeat;
  }
  .kitchen { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.5vh, 13px); }
  .prompt {
    font-size: var(--small); font-weight: 700;
    letter-spacing: 2.4px; text-transform: uppercase; color: var(--muted); text-align: center;
  }

  .jars { display: flex; justify-content: center; align-items: flex-end; gap: clamp(8px, 2.6vw, 22px); width: 100%; }
  .jar {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer; padding: 4px 2px;
    border-radius: 12px;
    transition: transform .16s;
  }
  .jar:hover { transform: translateY(-3px); }
  .jarart { width: 100%; max-width: clamp(84px, 26vw, 120px); }
  .jarart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .lid {
    transform-box: fill-box; transform-origin: 80% 100%;
    transition: transform .34s cubic-bezier(.4,1.5,.5,1);
  }
  .jar.on .lid { transform: translate(7px, -13px) rotate(-19deg); }
  .glassbody { transition: fill .25s; }
  .jar.on .glassbody { fill: rgba(242,229,205,0.12); }
  .jarglow { opacity: 0; transition: opacity .3s; }
  .jar.on .jarglow { opacity: 1; }
  .contents { transition: opacity .35s; }

  .jarname {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(12.5px, 3.4vw, 16px); line-height: 1.1;
    color: var(--muted); transition: color .2s;
  }
  .jar.on .jarname { color: var(--c); }
  .jartick {
    width: 19px; height: 19px; border-radius: 6px;
    border: 2px solid rgba(242,229,205,0.3);
    display: grid; place-items: center;
    font-size: 11px; color: var(--ink); line-height: 1;
    transition: background .2s, border-color .2s;
  }
  .jartick::after { content: '✓'; opacity: 0; font-weight: 700; transition: opacity .2s; }
  .jar.on .jartick { background: var(--c); border-color: var(--c); }
  .jar.on .jartick::after { opacity: 1; }

  .potwrap { position: relative; width: clamp(140px, 40vw, 192px); }
  .potwrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  #potTip { transform-box: fill-box; transform-origin: 50% 88%; transition: transform .6s cubic-bezier(.5,0,.3,1); }

  .reading {
    font-size: var(--tiny); line-height: 1.45; color: var(--muted);
    text-align: center; min-height: 2.5em;
  }
  .reading b { color: var(--bone); }

  .primary {
    width: 100%; max-width: 310px;
    min-height: clamp(44px, 8vh, 54px);
    border: 2px solid var(--line); border-radius: 13px; cursor: pointer;
    background: var(--ochre); color: #231704;
    font-weight: 700; font-size: clamp(13px, 3.6vw, 16px);
    letter-spacing: 2.2px; text-transform: uppercase;
    box-shadow: 0 6px 0 #8f6316, 0 12px 26px rgba(0,0,0,0.45);
    transition: transform .12s, box-shadow .12s, filter .2s;
  }
  .primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 0 #8f6316, 0 16px 30px rgba(0,0,0,0.5); }
  .primary:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #8f6316, 0 6px 16px rgba(0,0,0,0.4); }
  .primary:disabled { filter: saturate(.3) brightness(.6); cursor: default; }

  /* ── RESULT ── */
  .result { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.8vh, 16px); }
  .artbox {
    width: clamp(132px, 38vw, 196px); aspect-ratio: 1; flex: 0 0 auto;
    border-radius: 14px; overflow: hidden;
    border: 3px solid var(--line);
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    background: var(--ink2);
  }
  .artbox img, .artbox svg { width: 100%; height: 100%; display: block; object-fit: cover; }
  .artbox [hidden] { display: none !important; }
  .rcopy { text-align: center; }
  .rkicker { font-size: var(--tiny); font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  .rname {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: var(--h1); font-weight: 700; line-height: 1.05; margin-top: 2px;
  }
  .rformula {
    margin-top: 5px; font-size: var(--tiny); font-weight: 700;
    letter-spacing: 2.2px; text-transform: uppercase; color: var(--muted);
  }
  .rdesc { margin-top: clamp(7px,1.5vh,12px); font-size: var(--body); line-height: 1.58; color: rgba(242,229,205,0.84); }
  .ghost {
    margin-top: clamp(9px,1.8vh,15px);
    background: none; border: 2px solid rgba(242,229,205,0.26);
    border-radius: 24px; color: var(--bone); cursor: pointer;
    min-height: 42px; padding: 0 24px;
    font-size: var(--small); font-weight: 700; letter-spacing: 1.4px;
    transition: border-color .18s, background .18s;
  }
  .ghost:hover { border-color: var(--ochre); background: rgba(212,151,46,0.12); }

  /* ── FX LAYERS ── */
  .fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; overflow: visible; }
  .fall { position: absolute; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
  .drop {
    position: absolute; top: -70px; will-change: transform, opacity;
    animation: fallDown var(--dur) cubic-bezier(.35,.1,.65,1) var(--delay) forwards;
  }
  @keyframes fallDown {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    88%  { opacity: 1; }
    100% { transform: translateY(var(--dist)) rotate(var(--spin)); opacity: 0; }
  }
  .steam {
    position: absolute; border-radius: 50%;
    background: rgba(242,229,205,0.5); pointer-events: none;
    animation: puff .9s ease-out forwards;
  }
  @keyframes puff {
    0%   { transform: translateY(0) scale(.5); opacity: .6; }
    100% { transform: translateY(-46px) scale(1.7); opacity: 0; }
  }

  /* ── WIDE + SHORT (720x450 embeds, phones in landscape) ── */
  @media (min-width: 620px) {
    .inner { max-width: 640px; }
    .result { flex-direction: row; align-items: center; gap: clamp(16px, 3.4vw, 30px); }
    .rcopy { text-align: left; flex: 1 1 auto; }
    .artbox { width: clamp(150px, 27vw, 200px); }
  }
  @media (max-height: 520px) {
    .jarart { max-width: clamp(54px, 14vw, 76px); }
    .potwrap { width: clamp(124px, 29vw, 172px); }
    .reading { min-height: 1.4em; }
  }
  @media (max-height: 420px) {
    :root { --body: clamp(13px, 3.4vw, 15px); --h1: clamp(18px, 4.6vw, 24px); }
    .jarart { max-width: clamp(46px, 11.5vw, 62px); }
    .potwrap { width: clamp(84px, 19vw, 112px); }
    .kitchen { gap: clamp(4px, 1vh, 8px); }
    .primary { min-height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .drop, .steam { animation-duration: .01ms !important; }
  }
</style>
</head>
<body>

<!-- ══ INGREDIENT SPRITES ══ -->
<svg class="sprites" xmlns="http://www.w3.org/2000/svg"><defs>

    <path d="M9 18h22v17H9z" fill="#f2e5cd" stroke="#17121f" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M17 35V25h6v10z" fill="#d4972e" stroke="#17121f" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="11.5" y="21.5" width="5" height="5" fill="#4a9fb0" stroke="#17121f" stroke-width="2"/>
    <rect x="23.5" y="21.5" width="5" height="5" fill="#4a9fb0" stroke="#17121f" stroke-width="2"/>

</defs></svg>

<div class="app">

  <div class="topbar">
    <span class="brand">⚗ Love Mixer</span>
    <span class="spacer"></span>
    <span class="stamp" id="stamp">Sternberg · 1986</span>
  </div>

  <div class="stack" id="stack">

    <!-- ══ THE KITCHEN ══ -->
    <section class="screen on" id="s-kitchen">
      <div class="inner kitchen">
        <p class="prompt">Select what's present in this relationship</p>

        <div class="jars" id="jars"></div>

        <div class="potwrap">
          <svg viewBox="0 0 180 128" xmlns="http://www.w3.org/2000/svg">
            <g id="potTip">
              <defs>
                <clipPath id="potClip">
                  <path d="M26 42h128l-9 62a14 14 0 0 1-14 12H49a14 14 0 0 1-14-12z"/>
                </clipPath>
              </defs>
              <!-- handles -->
              <path d="M26 54c-12 0-16 6-16 12s5 12 15 12" fill="none" stroke="#17121f" stroke-width="7" stroke-linecap="round"/>
              <path d="M154 54c12 0 16 6 16 12s-5 12-15 12" fill="none" stroke="#17121f" stroke-width="7" stroke-linecap="round"/>
              <path d="M26 54c-12 0-16 6-16 12s5 12 15 12" fill="none" stroke="#7f8c3c" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M154 54c12 0 16 6 16 12s-5 12-15 12" fill="none" stroke="#7f8c3c" stroke-width="3.5" stroke-linecap="round"/>
              <!-- belly -->
              <path d="M26 42h128l-9 62a14 14 0 0 1-14 12H49a14 14 0 0 1-14-12z" fill="#4a9fb0" stroke="#17121f" stroke-width="4" stroke-linejoin="round"/>
              <!-- stew -->
              <g clip-path="url(#potClip)">
                <rect id="stew" x="20" y="116" width="140" height="0" fill="#6e6a5c"/>
                <g id="potBubbles"></g>
              </g>
              <!-- belly decoration -->
              <path d="M44 92h92" stroke="#17121f" stroke-width="3" opacity=".3"/>
              <circle cx="60" cy="78" r="4" fill="#f2e5cd" opacity=".35"/>
              <circle cx="120" cy="84" r="3" fill="#f2e5cd" opacity=".3"/>
              <!-- rim -->
              <rect x="18" y="32" width="144" height="14" rx="7" fill="#d4972e" stroke="#17121f" stroke-width="4"/>
            </g>
          </svg>
        </div>

        <div class="reading" id="reading"></div>
        <button class="primary" id="cookBtn">🥄 Cook it up</button>
      </div>
    </section>

    <!-- ══ THE REVEAL ══ -->
    <section class="screen" id="s-result">
      <div class="inner result">
        <div class="artbox" id="artbox">
          <img id="artImg" alt="" hidden>
          <div id="artFallback" style="width:100%;height:100%"></div>
        </div>
        <div class="rcopy">
          <div class="rkicker">You made</div>
          <div class="rname" id="rName"></div>
          <div class="rformula" id="rFormula"></div>
          <p class="rdesc" id="rDesc"></p>
          <button class="ghost" id="againBtn">← Mix another</button>
        </div>
      </div>
    </section>

    <div class="fall" id="fall"></div>
  </div>

  <svg class="fx" id="fx" xmlns="http://www.w3.org/2000/svg">
    <g id="hand" opacity="0">
      <rect x="-13" y="-520" width="26" height="462" rx="7" fill="#4a9fb0" stroke="#17121f" stroke-width="3"/>
      <rect x="-17" y="-66" width="34" height="17" rx="5" fill="#e0462f" stroke="#17121f" stroke-width="3"/>
      <path d="M-15 -50 Q-18 -22 -9 -6 Q0 4 9 -6 Q18 -22 15 -50 Z" fill="#edc49a" stroke="#17121f" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-14 -36 Q-26 -31 -25 -19 Q-24 -10 -14 -13" fill="#edc49a" stroke="#17121f" stroke-width="3" stroke-linejoin="round"/>
      <g id="carry"></g>
    </g>
    <g id="spoon" opacity="0">
      <rect x="-6" y="-150" width="12" height="130" rx="6" fill="#d4972e" stroke="#17121f" stroke-width="3"/>
      <ellipse cx="0" cy="-8" rx="19" ry="25" fill="#d4972e" stroke="#17121f" stroke-width="3"/>
      <ellipse cx="0" cy="-10" rx="11" ry="15" fill="#b3791c" stroke="none"/>
    </g>
  </svg>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ── INGREDIENTS ───────────────────────────────────────────────────────
  var DIMS = [
    { id:'passion',    label:'Passion',    color:'#e0462f', items:['ic-eggplant','ic-peach'] },
    { id:'intimacy',   label:'Intimacy',   color:'#4a9fb0', items:['ic-heart','ic-bubble']   },
    { id:'commitment', label:'Commitment', color:'#d4972e', items:['ic-ring','ic-house']     }
  ];

  var TYPES = {
    '000': { slug:'non-love', name:'Non-Love', color:'#6e6a5c', formula:'An empty pot',
      desc:'With none of the three, there is no real love — only a casual or transactional connection. Most of our everyday dealings with strangers and acquaintances live right here.' },
    '100': { slug:'infatuation', name:'Infatuation', color:'#e0462f', formula:'Passion only',
      desc:'A crush, or "love at first sight," running on excitement alone. No deep knowledge of the other person, no plan for a shared future. Intense — but usually short-lived.' },
    '010': { slug:'liking', name:'Liking', color:'#4a9fb0', formula:'Intimacy only',
      desc:'The warm closeness of true friendship. You know each other deeply and feel at ease together, but there is no romantic desire and no long-term promise. The bond of a best friend.' },
    '001': { slug:'empty-love', name:'Empty Love', color:'#8f8775', formula:'Commitment only',
      desc:'Commitment without closeness or passion. Common in long relationships where the connection has faded but both partners stay out of duty, vow, or habit — the shell without the heart.' },
    '110': { slug:'romantic-love', name:'Romantic Love', color:'#d3487e', formula:'Passion + Intimacy',
      desc:'Deeply close and powerfully drawn to each other, but with no promise about the future. The stuff of summer romances and great literature — thrilling, real, and completely uncertain.' },
    '011': { slug:'companionate-love', name:'Companionate Love', color:'#7f8c3c', formula:'Intimacy + Commitment',
      desc:'Deeply bonded and fully devoted, but without the heat of physical passion. The enduring love of long-married partners, lifelong friends, and close family.' },
    '101': { slug:'fatuous-love', name:'Fatuous Love', color:'#e07b2f', formula:'Passion + Commitment',
      desc:'Intense chemistry and big promises — but no real intimacy yet. The whirlwind romance that races to an engagement before the couple truly knows each other.' },
    '111': { slug:'consummate-love', name:'Consummate Love', color:'#f2c14e', formula:'Passion + Intimacy + Commitment',
      desc:'The complete ideal — passionate, emotionally close, and fully committed. Sternberg called this the goal of long-term love: rare, effortful to keep, and the most fulfilling of all.' }
  };

  var pick = { passion:false, intimacy:false, commitment:false };
  var cooking = false;
  var NS = 'http://www.w3.org/2000/svg';

  // ── BUILD THE JARS ────────────────────────────────────────────────────
  function jarSVG(d) {
    var body = 'M18 32h94q8 0 8 9v102q0 17-17 17H27q-17 0-17-17V41q0-9 8-9z';
    var put = function (ic, x, y, sz, rot) {
      return '<use href="#' + ic + '" x="' + x + '" y="' + y + '" width="' + sz + '" height="' + sz +
             '" transform="rotate(' + rot + ' ' + (x + sz / 2) + ' ' + (y + sz / 2) + ')"/>';
    };
    return '' +
      '<svg viewBox="0 0 130 182" xmlns="http://www.w3.org/2000/svg">' +
        '<defs><clipPath id="jc-' + d.id + '"><path d="' + body + '"/></clipPath>' +
          '<radialGradient id="jg-' + d.id + '" cx="50%" cy="52%" r="50%">' +
            '<stop offset="0%" stop-color="' + d.color + '" stop-opacity="0.38"/>' +
            '<stop offset="100%" stop-color="' + d.color + '" stop-opacity="0"/>' +
          '</radialGradient></defs>' +
        '<ellipse class="jarglow" cx="65" cy="98" rx="78" ry="92" fill="url(#jg-' + d.id + ')"/>' +
        '<path class="glassbody" d="' + body + '" fill="rgba(242,229,205,0.05)" stroke="#17121f" stroke-width="5" stroke-linejoin="round"/>' +
        '<rect x="22" y="98" width="86" height="34" rx="9" fill="' + d.color + '" opacity="0.22"/>' +
        '<g class="contents" clip-path="url(#jc-' + d.id + ')">' +
          put(d.items[0], 12, 58, 52, -14) +
          put(d.items[1], 64, 56, 50,  16) +
          put(d.items[0], 38, 106, 50,   7) +
        '</g>' +
        '<path d="' + body + '" fill="none" stroke="#17121f" stroke-width="5" stroke-linejoin="round"/>' +
        '<path d="M28 54q-8 34 0 68" fill="none" stroke="#f2e5cd" stroke-width="5" opacity="0.2" stroke-linecap="round"/>' +
        '<g class="lid">' +
          '<rect x="6" y="8" width="118" height="26" rx="9" fill="' + d.color + '" stroke="#17121f" stroke-width="5"/>' +
          '<rect x="46" y="-5" width="38" height="15" rx="7" fill="' + d.color + '" stroke="#17121f" stroke-width="5"/>' +
        '</g>' +
      '</svg>';
  }

  $('jars').innerHTML = DIMS.map(function (d) {
    return '<button class="jar" type="button" data-dim="' + d.id + '" aria-pressed="false" style="--c:' + d.color + '">' +
             '<span class="jarart">' + jarSVG(d) + '</span>' +
             '<span class="jarname">' + d.label + '</span>' +
             '<span class="jartick"></span>' +
           '</button>';
  }).join('');

  function paintReading() {
    var on = DIMS.filter(function (d) { return pick[d.id]; });
    $('reading').innerHTML = on.length
      ? 'Going in: <b>' + on.map(function (d) { return d.label; }).join(' + ') + '</b>'
      : 'Nothing going in — an empty pot is a real recipe.';
  }

  document.querySelectorAll('.jar').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (cooking) return;
      var id = btn.dataset.dim;
      pick[id] = !pick[id];
      btn.classList.toggle('on', pick[id]);
      btn.setAttribute('aria-pressed', pick[id] ? 'true' : 'false');
      paintReading();
    });
  });

  // ── GEOMETRY HELPERS ──────────────────────────────────────────────────
  function centreOf(el, fracY) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height * (fracY === undefined ? 0.5 : fracY) };
  }
  function place(g, x, y, rot, scale) {
    g.setAttribute('transform', 'translate(' + x + ',' + y + ') rotate(' + (rot || 0) + ') scale(' + (scale || 1) + ')');
  }

  // ── POT ───────────────────────────────────────────────────────────────
  var POT_TOP = 116, POT_MAX = 70;   // in the pot's own viewBox units
  function fillPot(frac, color) {
    var h = POT_MAX * frac;
    var stew = $('stew');
    stew.setAttribute('y', POT_TOP - h);
    stew.setAttribute('height', h);
    stew.setAttribute('fill', color);
  }
  function potBubbles(color) {
    var box = $('potBubbles');
    box.innerHTML = '';
    for (var i = 0; i < 7; i++) {
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 40 + Math.random() * 100);
      c.setAttribute('cy', 70 + Math.random() * 40);
      c.setAttribute('r', 3 + Math.random() * 5);
      c.setAttribute('fill', '#f2e5cd');
      c.setAttribute('opacity', 0.35);
      var a = document.createElementNS(NS, 'animate');
      a.setAttribute('attributeName', 'cy');
      a.setAttribute('from', c.getAttribute('cy'));
      a.setAttribute('to', 62);
      a.setAttribute('dur', (0.8 + Math.random()) + 's');
      a.setAttribute('repeatCount', 'indefinite');
      c.appendChild(a);
      box.appendChild(c);
    }
  }

  function steamAt(x, y) {
    var s = document.createElement('div');
    var size = 10 + Math.random() * 14;
    s.className = 'steam';
    s.style.cssText = 'left:' + (x - size / 2) + 'px;top:' + (y - size / 2) + 'px;width:' + size + 'px;height:' + size + 'px;';
    $('fall').appendChild(s);
    setTimeout(function () { s.remove(); }, 950);
  }

  // ── THE HAND ──────────────────────────────────────────────────────────
  function carry(items, show) {
    var g = $('carry');
    g.innerHTML = '';
    if (!show) return;
    items.forEach(function (ic, i) {
      var u = document.createElementNS(NS, 'use');
      u.setAttribute('href', '#' + ic);
      u.setAttribute('width', 34);
      u.setAttribute('height', 34);
      u.setAttribute('x', i === 0 ? -26 : -2);
      u.setAttribute('y', i === 0 ? -14 : -4);
      u.setAttribute('transform', 'rotate(' + (i === 0 ? -12 : 10) + ' ' + (i === 0 ? -9 : 15) + ' ' + (i === 0 ? 3 : 13) + ')');
      g.appendChild(u);
    });
  }

  function dropItems(items, from, to) {
    items.forEach(function (ic, i) {
      var g = document.createElementNS(NS, 'g');
      var u = document.createElementNS(NS, 'use');
      u.setAttribute('href', '#' + ic);
      u.setAttribute('width', 34); u.setAttribute('height', 34);
      u.setAttribute('x', -17); u.setAttribute('y', -17);
      g.appendChild(u);
      $('fx').appendChild(g);
      var sx = from.x + (i ? 14 : -14), sy = from.y;
      var t0 = performance.now(), dur = 340 + i * 70, spin = (i ? 1 : -1) * 160;
      (function frame(now) {
        var t = Math.min((now - t0) / dur, 1);
        var e = t * t;
        var x = sx + (to.x - sx) * t;
        var y = sy + (to.y - sy) * e;
        place(g, x, y, spin * t, 1 - 0.25 * t);
        g.setAttribute('opacity', t > 0.85 ? (1 - t) / 0.15 : 1);
        if (t < 1) requestAnimationFrame(frame); else g.remove();
      })(t0);
    });
  }

  function tween(ms, step) {
    return new Promise(function (res) {
      var t0 = performance.now();
      (function frame(now) {
        var t = Math.min((now - t0) / ms, 1);
        step(t);
        if (t < 1) requestAnimationFrame(frame); else res();
      })(t0);
    });
  }
  var easeOut = function (t) { return 1 - Math.pow(1 - t, 3); };
  var easeInOut = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };

  function handTrip(d, fillFrom, fillTo, color) {
    var hand = $('hand');
    var jarEl = document.querySelector('.jar[data-dim="' + d.id + '"] .jarart');
    var potEl = $('stew').ownerSVGElement;
    var jarTop = centreOf(jarEl, 0.14);
    var potMouth = centreOf(potEl, 0.30);
    var contents = jarEl.querySelector('.contents');

    hand.setAttribute('opacity', '1');
    place(hand, jarTop.x, jarTop.y - 150, 0, 1);

    return tween(250, function (t) {                       // reach down
      var e = easeOut(t);
      place(hand, jarTop.x, (jarTop.y - 150) + 150 * e, 0, 1);
    }).then(function () {
      return tween(100, function (t) {                     // dip in
        place(hand, jarTop.x, jarTop.y + 18 * Math.sin(t * Math.PI), 0, 1);
      });
    }).then(function () {
      carry(d.items, true);
      contents.style.opacity = '0.18';
      return sleep(60);
    }).then(function () {
      var x0 = jarTop.x, y0 = jarTop.y;
      var x1 = potMouth.x, y1 = potMouth.y - 62;
      return tween(300, function (t) {                     // carry across
        var e = easeInOut(t);
        var lift = -34 * Math.sin(t * Math.PI);
        place(hand, x0 + (x1 - x0) * e, y0 + (y1 - y0) * e + lift, -16 * Math.sin(t * Math.PI), 1);
      });
    }).then(function () {
      return tween(110, function (t) {                     // tip the hand out
        place(hand, potMouth.x, potMouth.y - 62, -46 * t, 1);
      });
    }).then(function () {
      carry(d.items, false);
      dropItems(d.items, { x: potMouth.x, y: potMouth.y - 54 }, { x: potMouth.x, y: potMouth.y + 6 });
      steamAt(potMouth.x - 10, potMouth.y);
      steamAt(potMouth.x + 14, potMouth.y - 4);
      // the pot fills while the hand is still pulling away
      tween(420, function (t) { fillPot(fillFrom + (fillTo - fillFrom) * easeOut(t), color); });
      return sleep(220);
    }).then(function () {
      return tween(190, function (t) {                     // hand leaves
        place(hand, potMouth.x, (potMouth.y - 62) - 190 * easeOut(t), -46 + 46 * t, 1);
        hand.setAttribute('opacity', 1 - t);
      });
    }).then(function () {
      hand.setAttribute('opacity', '0');
      carry([], false);
    });
  }

  // ── THE SPOON ─────────────────────────────────────────────────────────
  function stir(color) {
    var spoon = $('spoon');
    var potEl = $('stew').ownerSVGElement;
    var c = centreOf(potEl, 0.42);
    var rx = Math.max(16, potEl.getBoundingClientRect().width * 0.17);
    spoon.setAttribute('opacity', '1');

    return tween(190, function (t) {
      place(spoon, c.x + rx, c.y - 70 + 70 * easeOut(t), 12, 1);
    }).then(function () {
      potBubbles(color);
      return tween(1000, function (t) {
        var a = t * Math.PI * 4.4;
        place(spoon, c.x + Math.cos(a) * rx, c.y + Math.sin(a) * rx * 0.42, Math.cos(a) * 20, 1);
      });
    }).then(function () {
      return tween(210, function (t) {
        place(spoon, c.x + rx, c.y - 90 * easeOut(t), 12, 1);
        spoon.setAttribute('opacity', 1 - t);
      });
    }).then(function () { spoon.setAttribute('opacity', '0'); });
  }

  // ── POUR OUT + WATERFALL ──────────────────────────────────────────────
  function waterfall(items, color) {
    var box = $('fall');
    var w = box.clientWidth, h = box.clientHeight;
    var glyphs = items.length ? items : null;
    var n = glyphs ? 26 : 12;
    for (var i = 0; i < n; i++) {
      var el = document.createElement('div');
      el.className = 'drop';
      var size = 20 + Math.random() * 26;
      el.style.left = (Math.random() * (w - size)) + 'px';
      el.style.setProperty('--dur', (0.85 + Math.random() * 0.75) + 's');
      el.style.setProperty('--delay', (Math.random() * 0.5) + 's');
      el.style.setProperty('--dist', (h + 140) + 'px');
      el.style.setProperty('--spin', (Math.random() * 720 - 360) + 'deg');
      if (glyphs) {
        var ic = glyphs[Math.floor(Math.random() * glyphs.length)];
        el.innerHTML = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 40 40"><use href="#' + ic + '"/></svg>';
      } else {
        el.innerHTML = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 40 40">' +
          '<circle cx="20" cy="20" r="9" fill="' + color + '" opacity="0.5"/></svg>';
      }
      box.appendChild(el);
    }
    setTimeout(function () { box.innerHTML = ''; }, 2600);
  }

  function pourOut() {
    $('potTip').style.transform = 'rotate(-34deg)';
    return sleep(340).then(function () {
      return tween(260, function (t) { fillPot(0.62 * (1 - t), $('stew').getAttribute('fill')); });
    });
  }

  // ── RESULT ART ────────────────────────────────────────────────────────
  function fallbackArt(type, items) {
    var glyphs = items.length ? items : ['ic-bubble'];
    var marks = '';
    var spots = [[50, 46, 34], [104, 62, 30], [74, 104, 28]];
    for (var i = 0; i < 3; i++) {
      var ic = glyphs[i % glyphs.length];
      var s = spots[i];
      marks += '<use href="#' + ic + '" x="' + (s[0] - s[2] / 2) + '" y="' + (s[1] - s[2] / 2) +
               '" width="' + s[2] + '" height="' + s[2] + '"' +
               (items.length ? '' : ' opacity="0.25"') + '/>';
    }
    var petals = '';
    for (var k = 0; k < 10; k++) {
      var ang = (k / 10) * Math.PI * 2;
      petals += '<circle cx="' + (80 + Math.cos(ang) * 62).toFixed(1) + '" cy="' + (80 + Math.sin(ang) * 62).toFixed(1) +
                '" r="' + (k % 2 ? 3.4 : 5.6) + '" fill="' + type.color + '" opacity="0.6"/>';
    }
    return '<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">' +
      '<rect width="160" height="160" fill="#1b1826"/>' +
      '<circle cx="80" cy="80" r="62" fill="' + type.color + '" opacity="0.16"/>' +
      '<circle cx="80" cy="80" r="62" fill="none" stroke="' + type.color + '" stroke-width="3"/>' +
      '<circle cx="80" cy="80" r="71" fill="none" stroke="' + type.color + '" stroke-width="1.6" opacity="0.45" stroke-dasharray="5 6"/>' +
      petals + marks +
      '</svg>';
  }

  // Try each source in turn; fall back to the drawn placeholder if none load.
  function loadArt(img, ph, sources, phHTML) {
    var i = 0;
    ph.innerHTML = phHTML;
    ph.hidden = false; img.hidden = true;
    img.onload = function () { img.hidden = false; ph.hidden = true; };
    img.onerror = next;
    function next() {
      if (i >= sources.length) { img.removeAttribute('src'); img.hidden = true; ph.hidden = false; return; }
      img.src = sources[i++];
    }
    next();
  }

  function showArt(type, items) {
    loadArt($('artImg'), $('artFallback'),
            ['art/' + type.slug + '.jpg', 'art/' + type.slug + '.png'],
            fallbackArt(type, items));
  }

  // ── SCREENS ───────────────────────────────────────────────────────────
  function show(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); });
    var el = $(id); el.classList.add('on'); el.scrollTop = 0;
  }

  // ── COOK ──────────────────────────────────────────────────────────────
  $('cookBtn').addEventListener('click', function () {
    if (cooking) return;
    cooking = true;
    $('cookBtn').disabled = true;
    $('stamp').textContent = 'Cooking…';

    var key = DIMS.map(function (d) { return pick[d.id] ? '1' : '0'; }).join('');
    var type = TYPES[key];
    var active = DIMS.filter(function (d) { return pick[d.id]; });
    var allItems = active.reduce(function (a, d) { return a.concat(d.items); }, []);

    fillPot(0, type.color);
    $('potTip').style.transform = '';

    var chain = Promise.resolve();
    if (REDUCED) {
      chain = chain.then(function () { fillPot(0.62, type.color); return sleep(300); });
    } else {
      var share = 0.62 / Math.max(active.length, 1), sofar = 0;
      active.forEach(function (d) {
        var from = sofar, to = sofar + share; sofar = to;
        chain = chain.then(function () { return handTrip(d, from, to, type.color); });
      });
      if (!active.length) {
        chain = chain.then(function () {
          var potEl = $('stew').ownerSVGElement, c = centreOf(potEl, 0.3);
          steamAt(c.x, c.y); steamAt(c.x + 16, c.y - 6);
          return sleep(620);
        });
      }
      chain = chain.then(function () { return stir(type.color); });
    }

    chain.then(function () { return pourOut(); })
      .then(function () {
        $('rName').textContent = type.name;
        $('rName').style.color = type.color;
        $('rFormula').textContent = type.formula;
        $('rDesc').textContent = type.desc;
        $('artbox').style.borderColor = type.color;
        showArt(type, allItems);
        waterfall(allItems, type.color);
        return sleep(260);
      })
      .then(function () {
        show('s-result');
        $('stamp').textContent = 'Result';
        $('cookBtn').disabled = false;
        cooking = false;
      });
  });

  $('againBtn').addEventListener('click', function () {
    DIMS.forEach(function (d) {
      pick[d.id] = false;
      var b = document.querySelector('.jar[data-dim="' + d.id + '"]');
      b.classList.remove('on');
      b.setAttribute('aria-pressed', 'false');
      b.querySelector('.contents').style.opacity = '';
    });
    fillPot(0, '#6e6a5c');
    $('potBubbles').innerHTML = '';
    $('potTip').style.transform = '';
    $('fall').innerHTML = '';
    $('stamp').textContent = 'Sternberg · 1986';
    paintReading();
    show('s-kitchen');
  });

  paintReading();
})();
</script>

</body>
</html>
